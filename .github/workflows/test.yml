name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Verify lossless upgrade from v0.4.0
        run: |
          git fetch --depth=1 origin tag v0.4.0
          mkdir -p "$RUNNER_TEMP/dsh-upgrade-old"
          git archive v0.4.0 | tar -x -C "$RUNNER_TEMP/dsh-upgrade-old"
          node scripts/verify-upgrade.mjs "$RUNNER_TEMP/dsh-upgrade-old" .
      - run: npm pack --ignore-scripts
